<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jian Xu · 首次设置</title><link rel="stylesheet" href="app.css"><script src="setup.js" defer></script></head><body><header><span class="brand"><span class="mark">JX</span>首次设置</span></header><main class="login"><p class="eyebrow">ONE-TIME SETUP</p><h1>连接你的 MySQL，<br>就可以开始使用。</h1><p>只需在这台电脑设置一次。系统会保留原有资料，并建立需要的新表。</p><p id="setup-status" role="alert"></p><form id="setup-form"><div class="grid"><label>MySQL 地址<input name="db_host" value="localhost" required maxlength="255"></label><label>端口<input name="db_port" value="3306" type="number" min="1" max="65535" required></label></div><label>MySQL 用户名<input name="db_user" value="root" required></label><label>MySQL 密码<input name="db_password" type="password" autocomplete="off"></label><label>数据库名称<input name="db_name" value="jx_stamping_db" pattern="[A-Za-z0-9_]+" required></label><details><summary>首次管理员账号（已有原账号可留空）</summary><p>数据库里没有账号时才使用这里的设置。密码至少 12 个字。</p><label>管理员用户名<input name="admin_username" value="admin" autocomplete="username"></label><label>管理员密码<input name="admin_password" type="password" autocomplete="new-password"></label></details><button type="submit">连接并保存设置 →</button></form><p>密码只保存在本机 backend/.env，不会发送到 GitHub。请不要截图或分享密码。</p></main></body></html>
